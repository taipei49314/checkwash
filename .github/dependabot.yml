# Version updates are switched off (open-pull-requests-limit: 0 per ecosystem); Dependabot security updates continue. estate-consolidation T-27, 2026-09-02.
version: 2
updates:
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
