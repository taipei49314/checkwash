name: release
run-name: "PJU release / ${{ inputs.mode || 'native event capture' }} / ${{ github.ref_name }}"
# All hosted execution below is trusted metadata verification/publication.
# Product tests, builds and installations execute only on PJU.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture native metadata, verify PJU evidence, or publish admitted checks/assets
        type: choice
        options: [capture, verify, publish]
        default: capture
      admission:
        description: Reviewed capture/dispatch JSON with exact sources and external digests
        type: string
        required: true
  release:
    types: [published]
permissions:
  contents: read
jobs:
  capture-native-subject:
    if: github.event_name == 'release' || inputs.mode == 'capture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      PJU_ADMISSION: ${{ inputs.admission }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Capture native metadata only; no product qualification
        run: python -I -B trusted/tools/pju_release_bridge.py capture --output native-capture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pju-release-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-capture/
          if-no-files-found: error

  verify-pju-release:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'verify' || inputs.mode == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    env:
      PJU_ADMISSION: ${{ inputs.admission }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(inputs.admission).receipt_commit }}
          path: receipt-data
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(inputs.admission).head }}
          path: candidate-data
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: >-
          python -I -B trusted/tools/pju_release_bridge.py verify
          --trusted-root trusted --source-root candidate-data
          --receipt-root receipt-data/receipt --output release-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pju-release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-verification.json
          if-no-files-found: warn

  publish-pju-stage-check:
    needs: verify-pju-release
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: read
    env:
      PJU_ADMISSION: ${{ inputs.admission }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(inputs.admission).receipt_commit }}
          path: receipt-data
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(inputs.admission).head }}
          path: candidate-data
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: >-
          python -I -B trusted/tools/pju_release_bridge.py publish-check
          --trusted-root trusted --source-root candidate-data
          --receipt-root receipt-data/receipt --output release-stage-check.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pju-release-stage-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-stage-check.json
          if-no-files-found: warn

  publish-assets:
    needs: [verify-pju-release, publish-pju-stage-check]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && fromJSON(inputs.admission).stage == 'release-event'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    env:
      PJU_ADMISSION: ${{ inputs.admission }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(inputs.admission).receipt_commit }}
          path: receipt-data
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(inputs.admission).head }}
          path: candidate-data
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Revalidate authority, attach exact assets and read back actual bytes
        run: >-
          python -I -B trusted/tools/pju_release_bridge.py publish-assets
          --trusted-root trusted --source-root candidate-data
          --receipt-root receipt-data/receipt --output release-assets.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pju-release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets.json
          if-no-files-found: warn

  pypi:
    needs: publish-assets
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && fromJSON(inputs.admission).stage == 'release-event' && vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    env:
      PJU_ADMISSION: ${{ inputs.admission }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(inputs.admission).receipt_commit }}
          path: receipt-data
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(inputs.admission).head }}
          path: candidate-data
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: After Nelson approval, re-read source and actual GitHub asset bytes
        run: >-
          python -I -B trusted/tools/pju_release_bridge.py verify-assets
          --trusted-root trusted --source-root candidate-data
          --receipt-root receipt-data/receipt --output pypi-handoff.json
          --export-dist dist --pypi-only
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pju-pypi-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: pypi-handoff.json
          if-no-files-found: warn
