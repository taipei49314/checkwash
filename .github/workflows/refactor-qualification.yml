name: Original 60 refactors - mechanical qualification diagnostic

on:
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/refactors/**'
      - 'tools/refactor_qualification.py'
      - 'tools/refactor_qualification_inputs.json'
      - 'tools/owned_process_capture.py'
      - 'pyproject.toml'
      - '.github/workflows/refactor-qualification.yml'

permissions:
  contents: read

jobs:
  original-cohort:
    name: Original 60 - retain incomplete native exit, no FP adjudication
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: '3.12'
      - name: Isolated pinned pytest; keep native install exit and raw streams
        id: install
        shell: bash
        env:
          TRUSTED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/refactor-setup"
          if "$TRUSTED_PYTHON" -I -B -X utf8 -m venv "$RUNNER_TEMP/refactor-runtime" > "$RUNNER_TEMP/refactor-setup/venv.stdout" 2> "$RUNNER_TEMP/refactor-setup/venv.stderr"; then
            printf '0\n' > "$RUNNER_TEMP/refactor-setup/venv.exit"
          else
            code=$?
            printf '%s\n' "$code" > "$RUNNER_TEMP/refactor-setup/venv.exit"
            exit "$code"
          fi
          if "$RUNNER_TEMP/refactor-runtime/bin/python" -I -B -X utf8 -m pip --isolated install --no-input --no-cache-dir --index-url https://pypi.org/simple pytest==8.4.2 > "$RUNNER_TEMP/refactor-setup/install.stdout" 2> "$RUNNER_TEMP/refactor-setup/install.stderr"; then
            printf '0\n' > "$RUNNER_TEMP/refactor-setup/install.exit"
          else
            code=$?
            printf '%s\n' "$code" > "$RUNNER_TEMP/refactor-setup/install.exit"
            exit "$code"
          fi
          if "$RUNNER_TEMP/refactor-runtime/bin/python" -I -B -m pip freeze --all > "$RUNNER_TEMP/refactor-setup/freeze.stdout" 2> "$RUNNER_TEMP/refactor-setup/freeze.stderr"; then
            printf '0\n' > "$RUNNER_TEMP/refactor-setup/freeze.exit"
          else
            code=$?
            printf '%s\n' "$code" > "$RUNNER_TEMP/refactor-setup/freeze.exit"
            exit "$code"
          fi
      - name: Run original verifier once and preserve its native exit
        id: capture
        shell: bash
        env:
          REFACTOR_OUTPUT: ${{ runner.temp }}/refactor-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: '"$RUNNER_TEMP/refactor-runtime/bin/python" -I -B -X utf8 candidate/tools/refactor_qualification.py'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          name: refactor-original-60-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/refactor-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/refactor-setup/
          if-no-files-found: error
          retention-days: 30
