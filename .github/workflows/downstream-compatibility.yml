name: bounded downstream consumer compatibility

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'pyproject.toml'
      - '.github/workflows/downstream-compatibility.yml'

permissions:
  contents: read

jobs:
  owned-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # same pin as existing assertion qualification
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # existing reviewed pin
        id: python
        with:
          python-version: '3.12'
      - name: Qualify exact artifacts and capture all owned consumer cells
        id: capture
        run: python -I -B -X utf8 tools/downstream_compatibility.py
      - name: Retain native step outcomes separately from compatibility results
        if: ${{ !cancelled() }}
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python -I -B -X utf8 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'downstream-evidence'
          root.mkdir(exist_ok=True)
          (root / 'native-step-outcomes.json').write_text(json.dumps({
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'candidate_sha': os.environ['GITHUB_SHA'], 'steps': json.loads(os.environ['STEP_OUTCOMES'])
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # existing reviewed pin
        if: ${{ !cancelled() }}
        with:
          name: downstream-consumers-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downstream-evidence
          if-no-files-found: error
          include-hidden-files: true
