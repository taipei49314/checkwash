# Finite fixed-source supplement; source-only NOT_RUN until root promotion.
name: Python environment fixed static floor raw evidence
on:
  pull_request:
    paths:
      - .github/workflows/python-env-static-floor.yml
      - tools/python_env_static_floor.py
permissions:
  contents: read
jobs:
  six-native-batches:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/standin-step-diagnostics-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DIAGNOSTIC_SHA: ${{ github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DIAGNOSTIC_SHA }}
          persist-credentials: false
          path: diagnostic
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2fd330d8e17548124f0630ccc3880561e6a05c2a
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: df543dafd4ad19846b3c20f6a6c0aefce21060d1
          persist-credentials: false
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Preserve six native observations and installation receipts
        shell: bash
        run: python -I -B diagnostic/tools/python_env_static_floor.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: python-env-static-floor-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: python-env-static-evidence
          if-no-files-found: error
