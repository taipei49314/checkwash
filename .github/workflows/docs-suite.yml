name: docs suite

# ci.yml skips the 3-OS x 3-Python matrix for a pull request that changes only
# these Markdown files. Several tests read the documents (relative links, the
# documented test count, benchmarks/FAILURES.md), so this job runs the whole
# suite once on one leg instead. A pull request that also changes anything else
# runs both this job and the full ci.yml matrix.
# Keep the Markdown patterns identical to the paths-ignore list in ci.yml. The
# last entry makes a change to this workflow run it.
on:
  pull_request:
    paths:
      - "*.md"
      - "docs/**/*.md"
      - "action/**/*.md"
      - "benchmarks/**/*.md"
      - ".github/workflows/docs-suite.yml"

permissions:
  contents: read

concurrency:
  group: docs-suite-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history supports the trust-lag guard and Git-dependent tests.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }} # Preserve the run's PR merge snapshot.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
