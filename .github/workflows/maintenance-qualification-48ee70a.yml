# Source-only mechanical draft; native current health UNKNOWN; no owner policy change.
# Immutable main baseline and exact48ee70a candidate; no local or hosted execution performed.
# All48 changed Python paths:14 common A/B+34 candidate-only, no deletions; same isolated pins/flags/bounds.
name: temporary maintenance source diagnostics48ee70a

on:
  pull_request:

permissions:
  contents: read

