  paired-raw-evidence:
    if: github.head_ref == 'diagnose/maintenance-qualification-48ee70a'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 30cfb8bd39aa702aae0d59bde1d1400654137bad
      CANDIDATE_SHA: 48ee70ac383d0a6c82b66b0be9f33209f51c220e
