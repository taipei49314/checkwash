                              'reason': 'New candidate file is absent from original baseline; no baseline tool result exists'}
                          save()
                          continue
                      if entry is None:
                          manifest['subjects'][side]['paths'][path] = {'state': 'absent'}
                          raise RuntimeError(f'{side} fixed target is absent: {path}')
                      mode, kind, oid = entry
                      if mode not in ('100644', '100755') or kind != 'blob':
                          raise RuntimeError(f'{side} selected path is nonregular: {path}')
                      file = repo / path
