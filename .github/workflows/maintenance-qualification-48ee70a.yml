      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the same fixed tools for both source subjects
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, time

          out = pathlib.Path('maintenance-evidence')
          out.mkdir(exist_ok=True)
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'maintenance-tools'
          python = str(target / 'bin/python')
          manifest = {'purpose': 'TOOL_INSTALL_CAPTURE', 'run_id': os.environ['GITHUB_RUN_ID'],
                      'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'runs': []}
          commands = [
              ('venv', [sys.executable, '-I', '-B', '-m', 'venv', str(target)]),
              ('pip', [python, '-I', '-B', '-m', 'pip', 'install', '--report',
                       str(out / 'install.json'), 'ruff==0.16.6', 'mypy==2.3.1', 'pytest==8.4.2']),
              ('freeze', [python, '-I', '-B', '-m', 'pip', 'freeze', '--all']),
          ]
          for name, argv in commands:
              row = {'name': name, 'argv': argv, 'cwd': str(pathlib.Path.cwd())}
              start = time.monotonic()
              try:
                  run = subprocess.run(argv, capture_output=True, timeout=240)
                  stdout, stderr = run.stdout, run.stderr
                  row['exit'] = run.returncode
              except subprocess.TimeoutExpired as exc:
                  stdout, stderr = exc.stdout or b'', exc.stderr or b''
                  row.update(exit=None, execution_error='TimeoutExpired')
              except OSError as exc:
                  stdout, stderr = b'', str(exc).encode('utf-8')
                  row.update(exit=None, execution_error=type(exc).__name__)
              row['elapsed_seconds'] = time.monotonic() - start
              (out / ('install-' + name + '.stdout')).write_bytes(stdout)
              (out / ('install-' + name + '.stderr')).write_bytes(stderr)
              row['stdout_sha256'] = hashlib.sha256(stdout).hexdigest()
              row['stderr_sha256'] = hashlib.sha256(stderr).hexdigest()
              manifest['runs'].append(row)
              (out / 'install-commands.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
              if row['exit'] != 0:
                  raise SystemExit(row['exit'] if isinstance(row['exit'], int) and row['exit'] > 0 else 2)
              if name == 'freeze':
                  (out / 'freeze.txt').write_bytes(stdout)
          PY
