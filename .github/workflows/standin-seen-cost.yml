name: Stand-in synthetic capture and accounting controls

on:
  pull_request:
    paths:
      - 'src/checkwash/frontends/python/standin_installations.py'
      - 'tests/test_standin_source_limits.py'
      - 'tests/test_standin_seen_cost_contract.py'
      - 'tools/standin_seen_cost_*.py'
      - 'tools/standin_seen_cost_data/**'
      - 'tools/r1_cost_capture.py'
      - 'tools/r1_seen_cost_data/**'
      - 'tools/qualify_assertions.py'
      - 'tools/release_inventory.py'
      - '.github/workflows/standin-seen-cost.yml'

permissions:
  contents: read

env:
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  harness:
    name: Synthetic capture and accounting controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -I -m pip install pytest==8.4.2
      - run: python -I -m pytest -q tests/test_standin_seen_cost_contract.py
