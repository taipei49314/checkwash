name: v0.9.0 public publication verification

on:
  pull_request:
    paths:
      - '.github/workflows/v090-publication-verification.yml'
      - 'tools/verify_v090_publication.py'
      - 'docs/releases/v0.9.0-publication-verification.md'
      - 'release/advertised.toml'
      - 'README.md'

permissions:
  contents: read
  actions: read

jobs:
  public-publication:
    # Bounded execution for the maintainer-authorized v0.9.0 closeout only.
    if: github.head_ref == 'postrelease/v090-public-verification-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d6eda4f695fabb8e7d138f7a87b099d2028f0294
          path: release-source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify real GitHub and PyPI bytes and fresh public visitors
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -I -B tools/verify_v090_publication.py --source release-source --output public-publication-receipts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: v090-public-publication-${{ github.run_attempt }}
          path: |
            public-publication-receipts/*.json
            public-publication-receipts/*.log
          if-no-files-found: error
