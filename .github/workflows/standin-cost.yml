name: Issue 345 owned capture contract controls

on:
  pull_request:
    paths:
      - 'src/checkwash/frontends/python/standin_installations.py'
      - 'tools/standin_cost_*.py'
      - 'tools/standin_cost_data/**'
      - 'tools/owned_process_capture.py'
      - 'tools/qualify_assertions.py'
      - 'tools/assertion_contract.py'
      - 'tools/release_inventory.py'
      - '.github/workflows/standin-cost.yml'

permissions:
  contents: read

jobs:
  harness:
    name: Synthetic eight-input capture controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -I -m pip install pytest==8.4.2
      - run: python -I -m pytest -q tests/test_standin_cost_capture.py
