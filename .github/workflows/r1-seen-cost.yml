name: R1 seen-cohort capture (not behavior qualification)

on:
  pull_request:
    paths:
      - 'src/checkwash/frontends/python/frontend.py'
      - 'src/checkwash/frontends/python/binding_canonical.py'
      - 'tests/test_binding_canonical.py'
      - 'tests/test_reliability_r1.py'
      - 'tools/r1_cost_*.py'
      - 'tools/r1_seen_cost_data/**'
      - 'tools/qualify_assertions.py'
      - 'tools/release_inventory.py'
      - '.github/workflows/r1-seen-cost.yml'

permissions:
  contents: read

env:
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  harness:
    name: Synthetic capture and accounting controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -I -m pip install pytest==8.4.2
      - run: python -I -m pytest -q tools/r1_cost_tests.py

  prepare:
    name: Qualify both exact sources and delivered artifacts
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      manifest_sha256: ${{ steps.build.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Plan full denominator, build and qualify A/B
        id: build
        env:
          R1_OUTPUT: ${{ runner.temp }}/r1-prepared
        run: python -I -B -X utf8 candidate/tools/r1_cost_contract.py build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: r1-cost-prepared-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r1-prepared
          if-no-files-found: error
          retention-days: 30

  capture:
    name: Capture both original CLI results (${{ matrix.group }})
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: r1-cost-prepared-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r1-prepared
      - name: Preserve every first observation, including product exit 2
        env:
          R1_GROUP: ${{ matrix.group }}
          R1_OUTPUT: ${{ runner.temp }}/r1-cost-${{ matrix.group }}
          R1_PREPARED: ${{ runner.temp }}/r1-prepared
          R1_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
        run: python -I -B -X utf8 candidate/tools/r1_cost_contract.py worker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: r1-cost-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r1-cost-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 30

  accounting:
    name: Account for 4271 pairs; behavior adjudication remains separate
    needs: [prepare, capture]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: r1-cost-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r1-inputs
      - name: Validate raw records and preserve missing/unattempted denominator
        if: ${{ !cancelled() }}
        env:
          R1_OUTPUT: ${{ runner.temp }}/r1-aggregate
          R1_INPUTS: ${{ runner.temp }}/r1-inputs
          R1_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
        run: python -I -B -X utf8 candidate/tools/r1_cost_contract.py aggregate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: r1-cost-accounting-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r1-aggregate
          if-no-files-found: error
          retention-days: 30
