name: R1 synthetic capture and accounting controls

on:
  pull_request:
    paths:
      - 'src/checkwash/frontends/python/frontend.py'
      - 'src/checkwash/frontends/python/binding_canonical.py'
      - 'tests/test_binding_canonical.py'
      - 'tests/test_reliability_r1.py'
      - 'tools/r1_cost_*.py'
      - 'tools/r1_seen_cost_data/**'
      - 'tools/qualify_assertions.py'
      - 'tools/release_inventory.py'
      - '.github/workflows/r1-seen-cost.yml'

permissions:
  contents: read

env:
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  harness:
    name: Synthetic capture and accounting controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -I -m pip install pytest==8.4.2
      - run: python -I -m pytest -q tools/r1_cost_tests.py
