name: reference input preparation
on:
  push:
    branches: [prep/reference-input-failures]
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Input failures and original reference CLI contracts
        run: python -m pytest -o addopts='' -q tests/test_git_input_failures.py tests/test_strict_snapshot.py tests/test_normalization_execution_context.py tests/test_perf_git.py tests/e2e/test_cli.py --junitxml=reference-input-receipts/results.xml
      - name: Original reference and repair on the unchanged synthetic corpus
        if: ${{ !cancelled() }}
        run: python -I -B tools/prepare_reference_input_parity.py
      - name: Record exact proposed reference source
        if: always()
        shell: bash
        run: |
          mkdir -p reference-input-receipts
          git rev-parse HEAD > reference-input-receipts/source-sha.txt
          git diff --exit-code > reference-input-receipts/working-tree.diff
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reference-input-${{ matrix.os }}-${{ github.sha }}
          path: reference-input-receipts
          if-no-files-found: error
