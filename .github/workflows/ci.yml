name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # A pull request that changes only these Markdown files skips the matrix;
    # docs-suite.yml runs the whole suite once for it instead, so the tests that
    # read the documents still gate it. Pushes to main and tags run everything.
    # Keep this list identical to the paths in docs-suite.yml.
    paths-ignore:
      - "*.md"
      - "docs/**/*.md"
      - "action/**/*.md"
      - "benchmarks/**/*.md"

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request supersedes its running matrix. Every
  # push to main or a tag gets a group of its own and is never cancelled.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The README claims byte-identical verdicts across 3.11-3.13, so all
        # three are in the matrix. A claim whose gate does not cover it is
        # exactly what this tool exists to catch.
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          # Full history supports the trust-lag guard and Git-dependent tests.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }} # Preserve the run's PR merge snapshot.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
        id: install
      - run: pytest
      - name: emit corpus findings (determinism artifact)
        id: emit
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' && steps.install.outcome == 'success' }}
        shell: bash
        env:
          PYTHONUTF8: "1"  # artifact bytes must not depend on runner locale
          CHECKOUT_SHA: ${{ github.sha }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
        run: >-
          python tools/corpus_artifacts.py emit --output corpus-evidence
          --checkout-sha "$CHECKOUT_SHA" --candidate-head "$CANDIDATE_HEAD"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --os "$MATRIX_OS" --python "$MATRIX_PYTHON"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && (steps.emit.outcome == 'success' || steps.emit.outcome == 'failure') }}
        with:
          name: corpus-${{ matrix.os }}-py${{ matrix.python }}-attempt-${{ github.run_attempt }}
          path: corpus-evidence
          if-no-files-found: error

  dogfood:
    # checkwash runs on its own changes. The judge gets judged.
    #
    # This job used to be `if: github.event_name == 'pull_request'`, and this
    # repository has never had a pull request — so across every run in its
    # history it reported "skipped" and action/action.yml had still never been
    # executed once, while the README told people to use it. A previous audit
    # asked for the action to be dogfooded and the fix that shipped changed
    # *how* the job invoked it without noticing the job never ran at all.
    # Green because it did not run is the failure mode this project keeps
    # repeating; on a push there is a perfectly good diff to check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Exercise the published composite action itself, not just the CLI —
      # otherwise action/action.yml ships untested (reader audit 2026-08-02).
      - uses: ./action
        with:
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}

  install-from-tag:
    # Keep the existing required context. This always verifies the advertised
    # public release; the candidate suite has its own source/artifact checks.
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: read the explicit public installation subject
        id: advertised
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import os, pathlib, runpy
          validator = runpy.run_path('tools/verify_published_source.py')
          release = validator['advertised'](pathlib.Path('release/advertised.toml'))['release']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key in ('tag', 'commit', 'version'):
                  output.write(f'{key}={release[key]}\n')
          PY
      - name: verify the real advertised tag in its own clean checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.advertised.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.advertised.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/taipei49314/checkwash.git "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git worktree add --detach "$RUNNER_TEMP/advertised-source" "$RELEASE_COMMIT"
          python -I -B tools/verify_published_source.py --repo "$RUNNER_TEMP/advertised-source" --manifest release/advertised.toml --output public-receipts/advertised-source.json
      - name: install the actual public tag and bind the installed commit and version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.advertised.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.advertised.outputs.commit }}
          RELEASE_VERSION: ${{ steps.advertised.outputs.version }}
        run: |
          set -euo pipefail
          python -I -B -m venv "$RUNNER_TEMP/visitor"
          "$RUNNER_TEMP/visitor/bin/python" -I -B -m pip install "git+https://github.com/taipei49314/checkwash.git@$RELEASE_TAG"
          "$RUNNER_TEMP/visitor/bin/python" -I -B - <<'PY'
          import importlib.metadata, json, os, pathlib
          distribution = importlib.metadata.distribution('checkwash')
          direct = json.loads(distribution.read_text('direct_url.json'))
          assert distribution.version == os.environ['RELEASE_VERSION']
          assert direct['vcs_info']['commit_id'] == os.environ['RELEASE_COMMIT']
          pathlib.Path('public-receipts/advertised-install.json').write_text(json.dumps({
              'status': 'passed', 'version': distribution.version, 'direct_url': direct,
          }, sort_keys=True) + '\n', encoding='utf-8')
          PY
          "$RUNNER_TEMP/visitor/bin/checkwash" --version
          "$RUNNER_TEMP/visitor/bin/python" -I -B -m checkwash demo > /dev/null
          # The actual public engine still gates this push; failures propagate.
          "$RUNNER_TEMP/visitor/bin/python" -I -B -m checkwash check HEAD~1..HEAD --repo .
      - name: verify actual advertised download bytes
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import hashlib, json, pathlib, runpy, urllib.request
          validator = runpy.run_path('tools/verify_published_source.py')
          expected = validator['advertised'](pathlib.Path('release/advertised.toml'))['pyz']
          with urllib.request.urlopen(expected['url'], timeout=120) as response:
              raw = response.read(expected['bytes'] + 1)
          actual = {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
          assert actual['bytes'] == expected['bytes'] and actual['sha256'] == expected['sha256']
          pathlib.Path('public-receipts/advertised-download.json').write_text(json.dumps({
              'status': 'passed', 'url': expected['url'], **actual,
          }, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: advertised-public-receipts
          path: public-receipts/
          if-no-files-found: error

  published-source:
    # A real tag push verifies its own target even before advertised.toml moves.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: validate native public tag identity and complete public surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -I -B tools/verify_published_source.py --repo . --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT" --source-sha "$RELEASE_COMMIT" --remote https://github.com/taipei49314/checkwash.git --output public-receipts/tag-source.json
      - name: install and exercise the event's actual public tag
        shell: bash
        run: |
          set -euo pipefail
          python -I -B -m venv "$RUNNER_TEMP/tag-visitor"
          "$RUNNER_TEMP/tag-visitor/bin/python" -I -B -m pip install "git+https://github.com/taipei49314/checkwash.git@$RELEASE_TAG"
          "$RUNNER_TEMP/tag-visitor/bin/python" -I -B - <<'PY'
          import importlib.metadata, json, os, pathlib
          distribution = importlib.metadata.distribution('checkwash')
          direct = json.loads(distribution.read_text('direct_url.json'))
          assert distribution.version == os.environ['RELEASE_TAG'][1:]
          assert direct['vcs_info']['commit_id'] == os.environ['RELEASE_COMMIT']
          pathlib.Path('public-receipts/tag-install.json').write_text(json.dumps({
              'status': 'passed', 'version': distribution.version, 'direct_url': direct,
          }, sort_keys=True) + '\n', encoding='utf-8')
          PY
          "$RUNNER_TEMP/tag-visitor/bin/checkwash" --version
          "$RUNNER_TEMP/tag-visitor/bin/python" -I -B -m checkwash demo > /dev/null
          "$RUNNER_TEMP/tag-visitor/bin/python" -I -B -m checkwash check HEAD~1..HEAD --repo .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: tag-public-receipts
          path: public-receipts/
          if-no-files-found: error

  byte-compare:
    # The cross-OS determinism gate: every OS/Python combination must emit
    # byte-identical corpus findings (SPEC §8).
    needs: test
    if: ${{ !cancelled() }} # Independent evidence; pytest failures remain failures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: corpus
          pattern: corpus-*-attempt-${{ github.run_attempt }}
      - name: all artifacts must be byte-identical
        # Across every OS AND every Python version in the matrix. Verified
        # locally 2026-07-31 on 3.11.15 / 3.12.13 / 3.13.14 (identical, sha
        # 5bd75e8d…); this job keeps it true on Linux/macOS/Windows too.
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/corpus_artifacts.py compare --input corpus --output corpus-comparison.json
          --checkout-sha "$CHECKOUT_SHA" --candidate-head "$CANDIDATE_HEAD"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: corpus-comparison-attempt-${{ github.run_attempt }}
          path: corpus-comparison.json
          if-no-files-found: error
