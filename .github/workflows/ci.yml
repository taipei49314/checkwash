name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # A pull request that changes only these Markdown files skips the matrix;
    # docs-suite.yml runs the whole suite once for it instead, so the tests that
    # read the documents still gate it. Pushes to main and tags run everything.
    # Keep this list identical to the paths in docs-suite.yml.
    paths-ignore:
      - "*.md"
      - "docs/**/*.md"
      - "action/**/*.md"
      - "benchmarks/**/*.md"

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request supersedes its running matrix. Every
  # push to main or a tag gets a group of its own and is never cancelled.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The README claims byte-identical verdicts across 3.11-3.13, so all
        # three are in the matrix. A claim whose gate does not cover it is
        # exactly what this tool exists to catch.
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          # Full history supports the trust-lag guard and Git-dependent tests.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }} # Preserve the run's PR merge snapshot.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      # pytest-xdist splits the suite over two worker processes. Two rather than
      # one per vCPU: the hosted runners have 3-4 vCPUs (2 physical cores on
      # Linux and Windows), and the wall-clock budgets in tests/gates/test_perf.py
      # and tests/test_perf_*.py need a core to themselves.
      - run: pip install -e ".[dev]" "pytest-xdist==3.8.0"
        id: install
      - run: pytest -n 2 --dist worksteal
      - name: emit corpus findings (determinism artifact)
        id: emit
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' && steps.install.outcome == 'success' }}
        shell: bash
        env:
          PYTHONUTF8: "1"  # artifact bytes must not depend on runner locale
          CHECKOUT_SHA: ${{ github.sha }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
        run: >-
          python tools/corpus_artifacts.py emit --output corpus-evidence
          --checkout-sha "$CHECKOUT_SHA" --candidate-head "$CANDIDATE_HEAD"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --os "$MATRIX_OS" --python "$MATRIX_PYTHON"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && (steps.emit.outcome == 'success' || steps.emit.outcome == 'failure') }}
        with:
          name: corpus-${{ matrix.os }}-py${{ matrix.python }}-attempt-${{ github.run_attempt }}
          path: corpus-evidence
          if-no-files-found: error

  dogfood:
    # checkwash runs on its own changes. The judge gets judged.
    #
    # This job used to be `if: github.event_name == 'pull_request'`, and this
    # repository has never had a pull request — so across every run in its
    # history it reported "skipped" and action/action.yml had still never been
    # executed once, while the README told people to use it. A previous audit
    # asked for the action to be dogfooded and the fix that shipped changed
    # *how* the job invoked it without noticing the job never ran at all.
    # Green because it did not run is the failure mode this project keeps
    # repeating; on a push there is a perfectly good diff to check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Exercise the published composite action itself, not just the CLI —
      # otherwise action/action.yml ships untested (reader audit 2026-08-02).
      - uses: ./action
        with:
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}

  install-from-tag:
    # Keep the existing required context. This always verifies the advertised
    # public release; the candidate suite has its own source/artifact checks.
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: read the explicit public installation subject
        id: advertised
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import os, pathlib, runpy
          validator = runpy.run_path('tools/verify_published_source.py')
          release = validator['advertised'](pathlib.Path('release/advertised.toml'))['release']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key in ('tag', 'commit', 'version'):
                  output.write(f'{key}={release[key]}\n')
          PY
      - name: verify the real advertised tag in its own clean checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.advertised.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.advertised.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/taipei49314/checkwash.git "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git worktree add --detach "$RUNNER_TEMP/advertised-source" "$RELEASE_COMMIT"
          python -I -B tools/verify_published_source.py --repo "$RUNNER_TEMP/advertised-source" --manifest release/advertised.toml --output public-receipts/advertised-source.json
      - name: install the actual public tag and bind the installed commit and version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.advertised.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.advertised.outputs.commit }}
          RELEASE_VERSION: ${{ steps.advertised.outputs.version }}
        run: |
          set -euo pipefail
          python -I -B -m venv "$RUNNER_TEMP/visitor"
          "$RUNNER_TEMP/visitor/bin/python" -I -B -m pip install "git+https://github.com/taipei49314/checkwash.git@$RELEASE_TAG"
          "$RUNNER_TEMP/visitor/bin/python" -I -B - <<'PY'
          import importlib.metadata, json, os, pathlib
          distribution = importlib.metadata.distribution('checkwash')
          direct = json.loads(distribution.read_text('direct_url.json'))
          assert distribution.version == os.environ['RELEASE_VERSION']
          assert direct['vcs_info']['commit_id'] == os.environ['RELEASE_COMMIT']
          pathlib.Path('public-receipts/advertised-install.json').write_text(json.dumps({
              'status': 'passed', 'version': distribution.version, 'direct_url': direct,
          }, sort_keys=True) + '\n', encoding='utf-8')
          PY
          "$RUNNER_TEMP/visitor/bin/checkwash" --version
          "$RUNNER_TEMP/visitor/bin/python" -I -B -m checkwash demo > /dev/null
          # The actual public engine still gates this push; failures propagate.
          "$RUNNER_TEMP/visitor/bin/python" -I -B -m checkwash check HEAD~1..HEAD --repo .
      - name: verify actual advertised download bytes
        shell: bash
        run: |
          set -euo pipefail
          python -I -B - <<'PY'
          import hashlib, json, pathlib, runpy, urllib.request
          validator = runpy.run_path('tools/verify_published_source.py')
          expected = validator['advertised'](pathlib.Path('release/advertised.toml'))['pyz']
          with urllib.request.urlopen(expected['url'], timeout=120) as response:
              raw = response.read(expected['bytes'] + 1)
          actual = {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
          assert actual['bytes'] == expected['bytes'] and actual['sha256'] == expected['sha256']
          pathlib.Path('public-receipts/advertised-download.json').write_text(json.dumps({
              'status': 'passed', 'url': expected['url'], **actual,
          }, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: advertised-public-receipts
          path: public-receipts/
          if-no-files-found: error

  published-source:
    # A real tag push verifies its own target even before advertised.toml moves.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: validate native public tag identity and complete public surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -I -B tools/verify_published_source.py --repo . --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT" --source-sha "$RELEASE_COMMIT" --remote https://github.com/taipei49314/checkwash.git --output public-receipts/tag-source.json
      - name: install and exercise the event's actual public tag
        shell: bash
        run: |
          set -euo pipefail
          python -I -B -m venv "$RUNNER_TEMP/tag-visitor"
          "$RUNNER_TEMP/tag-visitor/bin/python" -I -B -m pip install "git+https://github.com/taipei49314/checkwash.git@$RELEASE_TAG"
          "$RUNNER_TEMP/tag-visitor/bin/python" -I -B - <<'PY'
          import importlib.metadata, json, os, pathlib
          distribution = importlib.metadata.distribution('checkwash')
          direct = json.loads(distribution.read_text('direct_url.json'))
          assert distribution.version == os.environ['RELEASE_TAG'][1:]
          assert direct['vcs_info']['commit_id'] == os.environ['RELEASE_COMMIT']
          pathlib.Path('public-receipts/tag-install.json').write_text(json.dumps({
              'status': 'passed', 'version': distribution.version, 'direct_url': direct,
          }, sort_keys=True) + '\n', encoding='utf-8')
          PY
          "$RUNNER_TEMP/tag-visitor/bin/checkwash" --version
          "$RUNNER_TEMP/tag-visitor/bin/python" -I -B -m checkwash demo > /dev/null
          "$RUNNER_TEMP/tag-visitor/bin/python" -I -B -m checkwash check HEAD~1..HEAD --repo .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: tag-public-receipts
          path: public-receipts/
          if-no-files-found: error

  byte-compare:
    # The cross-OS determinism gate: every OS/Python combination must emit
    # byte-identical corpus findings (SPEC §8).
    needs: test
    if: ${{ !cancelled() }} # Independent evidence; pytest failures remain failures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: corpus
          pattern: corpus-*-attempt-${{ github.run_attempt }}
      - name: all artifacts must be byte-identical
        # Across every OS AND every Python version in the matrix. Verified
        # locally 2026-07-31 on 3.11.15 / 3.12.13 / 3.13.14 (identical, sha
        # 5bd75e8d…); this job keeps it true on Linux/macOS/Windows too.
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/corpus_artifacts.py compare --input corpus --output corpus-comparison.json
          --checkout-sha "$CHECKOUT_SHA" --candidate-head "$CANDIDATE_HEAD"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: corpus-comparison-attempt-${{ github.run_attempt }}
          path: corpus-comparison.json
          if-no-files-found: error

  timing-469:
    # TEMPORARY (#469, D-154; approval list A82). Remove this whole job when
    # D-154's timing paragraph is filled from its log. It times the
    # subject-replacement pass on synthetic test files of 30,000, 100,000
    # and 200,000 syntax nodes per side and prints the times. It runs only
    # for #511's branch and judges nothing. It never fails the run: every
    # measurement runs in its own process under its own time budget, and an
    # overrun, an error or a crash there is printed, not raised.
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/subject-replacement-limits-469'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: time the subject-replacement pass (temporary, issue 469)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          CHECKOUT_SHA: ${{ github.sha }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -I -B - <<'PY'
          import json, os, statistics, subprocess, sys, time

          # One measurement: build the source files and run analyze to the end of the
          # subject-replacement pass, timing the pass itself.
          CHILD = r'''
          import ast, datetime, json, os, sys, time
          sys.path.insert(0, os.path.abspath("src"))
          from checkwash import engine
          from checkwash.change import FileChange
          from checkwash.config import Config
          from checkwash.contract import Contract
          from checkwash.frontends.python import subject_replacements as subject

          shape, target = sys.argv[1], int(sys.argv[2])
          # straight: tests asserting a name bound earlier (the shape the cache is for);
          # helper: tests that call one module helper holding a literal assertion;
          # statements: one such test among module-level assignments.
          UNITS = {
              "straight": (b"", lambda i: b"def test%d():\n    value = f(1)\n    assert value == 2\n" % i),
              "helper": (b"def check():\n    assert f(1) == 2\n", lambda i: b"def test%d():\n check()\n" % i),
              "statements": (b"def test0():\n    value = f(1)\n    assert value == 2\n", lambda i: b"v%d = 1\n" % i),
          }

          def nodes(source):
              return sum(1 for _ in ast.walk(ast.parse(source)))

          def side(name):
              prefix, unit = UNITS[shape]
              head = b'"""Timing input for #469, %s side."""\nfrom app.calc import f\n' % name + prefix
              count, rest = divmod(target - nodes(head), nodes(unit(1)) - 1)
              return head + b"".join(unit(i + 1) for i in range(count)) + b"pass\n" * rest

          before, after = side(b"before"), side(b"after")
          path = "tests/test_timing.py"
          sources = {"app/__init__.py": b"", "app/calc.py": b"def f(x):\n    return x + 1\n", path: after}
          record = {"shape": shape, "nodes": [nodes(before), nodes(after)], "bytes": [len(before), len(after)]}
          calls = {"subject_call": 0, "assertion_scope": 0}

          def counting(name, original):
              def counted(*args, **kwargs):
                  calls[name] += 1
                  return original(*args, **kwargs)
              return counted

          subject._subject_call = counting("subject_call", subject._subject_call)
          subject._assertion_scope = counting("assertion_scope", subject._assertion_scope)

          class Reached(BaseException):
              pass

          original = engine.subject_replacement_events

          def timed(*args, **kwargs):
              record["to_pass_s"] = round(time.perf_counter() - start, 3)
              began = time.perf_counter()
              events = original(*args, **kwargs)
              record["pass_s"] = round(time.perf_counter() - began, 3)
              record["events"] = len(events)
              raise Reached

          engine.subject_replacement_events = timed
          start = time.perf_counter()
          try:
              engine.analyze([FileChange(path, "modified", before, after)], Config(), Contract(), [],
                             datetime.date(2026, 10, 19), root_reader=sources.get,
                             root_path_lister=lambda: sorted(sources),
                             root_batch_reader=lambda paths: {p: sources.get(p) for p in paths})
              record["error"] = "the pass was not reached"
          except Reached:
              pass
          except Exception as error:
              record["error"] = f"{type(error).__name__}: {error}"[:300]
          record.update(calls)
          print(json.dumps(record))
          '''

          def main():
              deadline = time.monotonic() + 35 * 60
              plan = [("straight", (30_000, 100_000, 200_000), 3),
                      ("statements", (30_000, 100_000, 200_000), 1),
                      ("helper", (10_000, 30_000, 100_000, 200_000), 1)]
              print("python", sys.version.split()[0], "checkout", os.environ.get("CHECKOUT_SHA"),
                    "head", os.environ.get("CANDIDATE_HEAD"), flush=True)
              summary = []
              for shape, sizes, runs in plan:
                  overran = False
                  for size in sizes:
                      seconds = []
                      for run in range(1, runs + 1):
                          label = f"{shape} nodes={size} run={run}"
                          budget = min(300, deadline - time.monotonic())
                          if overran or budget < 10:
                              reason = "a smaller size overran its budget" if overran else "the job's budget is spent"
                              print(f"{label}: not run, {reason}", flush=True)
                              break
                          try:
                              done = subprocess.run([sys.executable, "-I", "-B", "-c", CHILD, shape, str(size)],
                                                    capture_output=True, text=True, timeout=budget)
                          except subprocess.TimeoutExpired:
                              print(f"{label}: over its {budget:.0f} s budget", flush=True)
                              overran = True
                              break
                          lines = done.stdout.strip().splitlines()
                          print(f"{label}: exit {done.returncode}, {lines[-1] if lines else 'no output'}", flush=True)
                          if done.returncode:
                              print(done.stderr[-3000:], flush=True)
                          try:
                              seconds.append(json.loads(lines[-1])["pass_s"])
                          except (IndexError, KeyError, ValueError):
                              pass
                      if seconds:
                          summary.append(f"{shape} nodes={size} runs={len(seconds)} median_pass_s={statistics.median(seconds)}")
              print("summary (the subject-replacement pass's own time):", flush=True)
              for row in summary:
                  print(row, flush=True)

          try:
              main()
          except BaseException as error:
              print(f"timing stopped early: {type(error).__name__}: {error}", flush=True)
          PY
