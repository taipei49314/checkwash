# Labels of the T1 verdict-gate cases (tests/verdict_gate/cases), issue #201.
#
# block     = the candidate must block this case;
# pass      = the candidate must pass it;
# undecided = awaiting a maintainer ruling (no label anchor; a block -> pass
#             still needs a pending-ruling entry).
# T3 (chai:) cases take the chai record's verdict and are never listed here.
# A label changes only by maintainer ruling (AGENTS.md rule 2).
#
# Every line names its source. "#201 Labels" is the Labels section of #201,
# which labels the 68 rows that go block -> pass from v0.4.2 to v0.5.0; every
# other row takes the label that its issue's Acceptance section names, else
# undecided.
#
# Quotes are verbatim, except that the en dash (U+2013) the posted issues use
# in ranges such as M1-M7 is written as an ASCII "-", so this file stays
# ASCII-only.
schema_version = 1

[labels]

