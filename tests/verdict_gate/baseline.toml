# Pins of the previous-release verdict gate (issue #201; tools/verdict_gate.py).
#
# [baseline]   the previous release's checkwash.pyz. The gate fails unless the
#              downloaded asset has this sha256 and size, its checkwash/*
#              members equal src/checkwash at this commit, and the CLI reports
#              this version.
# [canary]     v0.4.2 against v0.5.0 over the T1 cases; must reproduce
#              block_to_pass exactly. Not rotated with the baseline.
# [t3.cases]   chai:<id> = input_sha256 of every "verdict": "block" record of
#              tests/data/javascript_chai_mutations.json at the baseline commit.
#
# [baseline_blocked] and [canary] block_to_pass were pinned from the first
# hosted run of this workflow (run 36983670433, PR #203): the CLI saw 73
# baseline blocks and 67 canary block -> pass cases. The in-process probe
# matrices had 68; #197 B7 is the difference (git reports its
# rename-with-edit as delete + add, and deleting a test under
# .github/workflows/ escalates), see tests/verdict_gate/README.md.
#
# 2026-10-03: the #197 dual-obligation PR added five cases under the #201
# ruling 196.followup.new-gate-cases. i197/Q5a and Q5b block on v0.5.0
# (baseline_blocked 73 -> 75); i197/O1-O3 block on v0.4.2 and pass on v0.5.0
# (canary block_to_pass 67 -> 70). Both pins are the local gate's proposal
# over the 154 T1 cases.
#
# 2026-10-04: the 184.3 PR added i196/W1 and Wc1 under the same ruling. Both
# block on v0.5.0 (baseline_blocked 75 -> 77) and on v0.4.2, so the canary
# set stays 70. The pin is the local gate's proposal over the 156 T1 cases.
#
# 2026-10-05: rotated to v0.6.0 (docs/RELEASING.md step 8c, D-094).
# [baseline] pins the release commit 8c70efb and the Release's checkwash.pyz.
# v0.6.0 blocks 156 cases (baseline_blocked 77 -> 156): the 26 T3 cases and
# the 130 T1 cases labelled block. Against v0.5.0, 88 T1 cases go pass ->
# block, and the nine fp-fix cases the acceptance file held go block -> pass.
# [t3.cases] is unchanged, and [canary] is not rotated. The pin is the local
# gate's proposal over the 156 T1 and 26 T3 cases with the rotated
# [baseline].
#
# Rotation (after a release): repoint [baseline] to the new release, re-read
# [t3.cases] from the gate's proposal, and re-pin [baseline_blocked]. Asset
# sha256 and size come from `gh release view vX.Y.Z --json assets` (the
# checkwash.pyz digest); the gate re-checks them on every run.
